[project]
name = "causal-foundations"
version = "0.1.0"
description = "Investigating Causal Alignment, Shortcut Learning, and Interpretability in Tabular Foundation Models using Folktables and SCMs"
readme = "README.md"
authors = [
    { name = "Luciano Luz Beylouni Farias", email = "beylouniluciano@gmail.com" },
    { name = "Guilherme Torresan Bazzo" },
    { name = "João Enrique Rego Cairuga" },
    { name = "Kamille Konarzewski Pimentel" },
    { name = "Sofia Batista Sartori" }
]
requires-python = ">=3.12"
dependencies = [
    "folktables>=0.0.12",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "tabpfn>=9.2.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
